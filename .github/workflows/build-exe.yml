name: Build Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend dist into backend
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "backend\app\frontend_dist" -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force "frontend\dist" "backend\app\frontend_dist"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure data folders exist (company part data is not stored in git)
        shell: pwsh
        working-directory: backend
        run: |
          New-Item -ItemType Directory -Force -Path "master_data" | Out-Null
          New-Item -ItemType Directory -Force -Path "app\data" | Out-Null

      - name: Build exe with PyInstaller
        shell: pwsh
        working-directory: backend
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          Get-ChildItem -Filter "*.spec" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          $pyArgs = @(
              "--onefile"
              "--name", "LoadSimApp"
              "--add-data", "master_data;master_data"
              "--add-data", "app\data;app\data"
              "--add-data", "app\frontend_dist;app\frontend_dist"
              "--hidden-import", "uvicorn.loops.auto"
              "--hidden-import", "uvicorn.protocols.http.auto"
              "--hidden-import", "uvicorn.protocols.websockets.auto"
              "--hidden-import", "uvicorn.lifespan.on"
              "--hidden-import", "app.main"
              "--hidden-import", "app.routers.containers"
              "--hidden-import", "app.routers.simulations"
              "--hidden-import", "app.routers.part_types"
              "--hidden-import", "app.routers.pipeline"
              "--hidden-import", "app.scripts.import_part_master"
              "run_exe.py"
          )
          python -m PyInstaller @pyArgs

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoadSimApp
          path: backend/dist/LoadSimApp.exe
          if-no-files-found: error
